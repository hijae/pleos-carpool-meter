plugins { id 'com.android.application' }
android {
 namespace 'ai.pleos.smoke'
 compileSdk 34
 defaultConfig { applicationId 'ai.pleos.smoke'; minSdk 28; targetSdk 34; versionCode 1; versionName '1.0' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 testOptions {
  unitTests.includeAndroidResources = true
  unitTests.all {
   ['https.proxyHost','https.proxyPort','http.proxyHost','http.proxyPort','javax.net.ssl.trustStore'].each { key ->
    if (System.getProperty(key)) systemProperty key, System.getProperty(key)
   }
  }
 }
}

dependencies {
 implementation 'ai.pleos.playground:Vehicle:2.3.2'
 implementation 'ai.pleos.playground:FusedLocation:1.1.3'
 implementation 'ai.pleos.playground:NaviHelper:3.0.5'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.14.1'
}
